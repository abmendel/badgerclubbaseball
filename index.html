<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badger Club Baseball HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one frosted-glass shell floating over a warm field with a big stitched baseball; sidebar nav inside the shell, white glass cards inside main. Badger red is the single accent. */
:root{
  --red:#c5050c; --red-soft:rgba(197,5,12,.1); --red-rgb:197,5,12;
  --ink:#2a1b17; --muted:#7c6862; --dim:#a8958e;
  --bg:#f6e8de;
  --good:#2b9257; --warn:#d9821a; --bad:#d23a2e; --info:#3a74c9;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shell:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,.26));
  --card:linear-gradient(165deg,rgba(255,255,255,.82),rgba(255,255,255,.56));
  --edge:rgba(255,255,255,.85); --line:rgba(90,40,25,.09); --line2:rgba(90,40,25,.14);
  --shadow:0 24px 60px -32px rgba(120,50,20,.5);
  --r:20px; --r-lg:30px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* scene */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:radial-gradient(900px 600px at 8% 0%,rgba(var(--red-rgb),.16),transparent 60%),
  radial-gradient(800px 700px at 100% 100%,rgba(240,160,80,.35),transparent 60%),
  linear-gradient(135deg,#fbf1ea 0%,#f4dccb 50%,#f8e9de 100%)}
#bg{position:absolute;inset:0}

/* gate */
.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px}
.gatecard{width:min(400px,100%);padding:34px 30px 28px;border-radius:var(--r-lg);text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.gatecard img{width:84px;height:auto;filter:drop-shadow(0 10px 20px rgba(var(--red-rgb),.3))}
.gatecard h1{font-family:var(--display);font-size:34px;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.gatecard p{margin:0;color:var(--muted)}
.gatecard form{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:6px}
.gatecard .err{color:var(--bad);font-size:13px;min-height:18px}

.glass{background:var(--shell);-webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%);border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9)}
.card{background:var(--card);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--edge);border-radius:var(--r);box-shadow:0 14px 34px -26px rgba(120,50,20,.55),inset 0 1px 0 #fff;padding:18px;min-width:0}

/* shell */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:236px minmax(0,1fr);max-width:1480px;margin:22px auto;border-radius:var(--r-lg);min-height:calc(100vh - 44px);overflow:hidden}
.side{padding:22px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid rgba(255,255,255,.6)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand img{width:38px;height:auto}
.brand b{font-family:var(--display);font-size:21px;line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.glabel{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;padding:12px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:12px;font-weight:600;font-size:13.5px;color:#5a4640;text-align:left;transition:background .15s}
.nav svg{width:17px;height:17px;flex:none;opacity:.8}
.nav:hover{background:rgba(255,255,255,.55)}
.nav.on{background:rgba(255,255,255,.9);color:var(--ink);box-shadow:0 6px 16px -10px rgba(120,50,20,.5)}
.nav.on svg{color:var(--red);opacity:1}
.nav .ct{margin-left:auto;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center}
.nav .ct.soft{background:rgba(90,40,25,.1);color:var(--muted)}
.side .grow{flex:1;min-height:16px}
.sync{border-radius:16px;padding:12px;background:rgba(255,255,255,.5);border:1px solid var(--edge);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.sync b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}
.dot.warn{background:var(--warn)} .dot.off{background:var(--dim)}

main{padding:22px 24px 30px;min-width:0;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:20}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid var(--edge);flex:1 1 260px;max-width:420px;position:relative}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:0;flex:1;min-width:0}
.results{position:absolute;left:0;right:0;top:48px;background:#fff;border-radius:16px;box-shadow:0 20px 50px -20px rgba(80,30,10,.45);padding:6px;display:flex;flex-direction:column;max-height:360px;overflow:auto}
.results button{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;text-align:left}
.results button:hover,.results button:focus-visible{background:var(--red-soft)}
.results small{color:var(--muted);margin-left:auto;font-size:11.5px}
.spacer{flex:1}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.7);border:1px solid var(--edge);position:relative;flex:none}
.iconbtn svg{width:17px;height:17px}
.iconbtn .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:999px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.who{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid var(--edge);height:42px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.who small{display:block;font-size:11px;color:var(--muted)}
.who b{font-size:13px;font-weight:600}
.pop{position:absolute;right:0;top:50px;width:340px;max-width:calc(100vw - 32px);background:#fff;border-radius:18px;box-shadow:0 24px 60px -24px rgba(80,30,10,.5);padding:12px;display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow:auto}
.pop h4{margin:2px 4px 4px;font-size:13px}

.banner{padding:10px 14px;border-radius:14px;background:rgba(255,248,235,.85);border:1px solid rgba(217,130,26,.35);color:#7a4a0c;font-size:13px}

.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead h2{font-family:var(--display);font-size:34px;text-transform:uppercase;letter-spacing:.01em;line-height:1}
.pagehead p{margin:4px 0 0;color:var(--muted)}

/* buttons, inputs */
.btn{height:38px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;background:rgba(255,255,255,.85);border:1px solid var(--line2);white-space:nowrap}
.btn:hover{background:#fff}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 10px 22px -12px rgba(var(--red-rgb),.8)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{height:30px;padding:0 12px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.mini:hover{background:rgba(90,40,25,.07);color:var(--ink)}
.mini svg{width:15px;height:15px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.inp{height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.92);outline:0;width:100%}
textarea.inp{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
.inp:focus{border-color:rgba(var(--red-rgb),.55);box-shadow:0 0 0 3px rgba(var(--red-rgb),.12)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid var(--edge);flex-wrap:wrap}
.seg button{padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 4px 12px -6px rgba(80,30,10,.4)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid;white-space:nowrap}
.p-low{color:var(--good);border-color:rgba(43,146,87,.4);background:rgba(43,146,87,.08)}
.p-medium{color:var(--warn);border-color:rgba(217,130,26,.45);background:rgba(217,130,26,.08)}
.p-high{color:var(--bad);border-color:rgba(210,58,46,.45);background:rgba(210,58,46,.08)}
.p-neutral{color:var(--muted);border-color:var(--line2);background:rgba(255,255,255,.6)}
.p-red{color:#fff;background:var(--red);border-color:var(--red)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:8px;font-size:11.5px;font-weight:700;font-family:var(--body)}
.chip.w{background:rgba(43,146,87,.14);color:var(--good)} .chip.l{background:rgba(210,58,46,.12);color:var(--bad)} .chip.t{background:rgba(90,40,25,.08);color:var(--muted)}

/* cards */
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ch h3{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#5a4640}
.ch .link{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.ch .link:hover{color:var(--red)}
.ch .link svg{width:13px;height:13px}
.sub{color:var(--muted);font-size:12.5px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line2);border-radius:14px;background:rgba(255,255,255,.35)}

/* overview */
.hero{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;gap:14px}
.hello{display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.hello .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,#e2471f,var(--red));color:#fff;display:grid;place-items:center;font-weight:700}
.hello h2{font-size:20px;font-weight:700}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .lab{font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--dim);text-transform:uppercase}
.kpi .big{font-family:var(--display);font-size:44px;font-weight:600;line-height:.95;letter-spacing:.005em}
.kpi .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.kpi svg.spark{width:110px;height:42px;flex:none}
.delta{font-size:12px;font-weight:700}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.ovgrid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(280px,1fr);gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}

table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-size:11px;font-weight:600;color:var(--dim);text-align:left;padding:0 8px 8px;white-space:nowrap}
.t td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:middle}
.t tr.done td{color:var(--dim)} .t tr.done .ttl{text-decoration:line-through}
.t .ttl{font-weight:600}
.tw{overflow-x:auto}
.chk{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;background:#fff;flex:none}
.chk.on{background:var(--red);border-color:var(--red);color:#fff}
.chk svg{width:12px;height:12px}

.timeline{display:flex;flex-direction:column;gap:12px}
.tday{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.titem{display:grid;grid-template-columns:62px 4px 1fr;gap:10px;align-items:start;font-size:13px}
.titem .tm{color:var(--muted);font-size:12px;padding-top:1px}
.titem .bar{width:4px;border-radius:4px;align-self:stretch;min-height:30px}
.titem b{display:block;font-weight:600}
.titem small{color:var(--muted)}

.prog{height:8px;border-radius:999px;background:rgba(90,40,25,.08);overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#e9573b,var(--red))}
.prog.good i{background:linear-gradient(90deg,#48b874,var(--good))}
.plist{display:flex;flex-direction:column;gap:12px}
.prow{display:flex;flex-direction:column;gap:6px}
.prow .top2{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.prow .top2 span{color:var(--muted);font-variant-numeric:tabular-nums}

.std td:first-child{font-weight:600}
.std tr.us td{background:var(--red-soft)}
.std tr.us td:first-child{color:var(--red)}

.ann{display:flex;flex-direction:column;gap:10px}
.annitem{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid var(--line);display:flex;gap:10px}
.annitem p{margin:0 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.annitem small{color:var(--muted)}
.annitem .x{margin-left:auto}

/* calendar */
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.calhead h3{font-family:var(--display);font-size:26px;text-transform:uppercase;min-width:190px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;padding:0 2px 6px}
.week{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.series{font-size:11.5px;font-weight:700;color:var(--red);background:var(--red-soft);border:1px dashed rgba(var(--red-rgb),.35);border-radius:8px;padding:4px 8px;display:flex;gap:8px;align-items:center}
.series span{font-weight:500;color:#8a4a44}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{min-height:92px;border-radius:12px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);padding:6px;display:flex;flex-direction:column;gap:3px;text-align:left;align-items:stretch;min-width:0}
.day:hover{background:rgba(255,255,255,.85)}
.day.out{opacity:.45}
.day.sel{outline:2px solid var(--red);outline-offset:-2px}
.day .dn{font-size:12px;font-weight:700;color:#6a554e}
.day.today .dn{background:var(--red);color:#fff;border-radius:999px;width:22px;height:22px;display:grid;place-items:center}
.ev{font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.dlist{display:flex;flex-direction:column;gap:8px}
.ditem{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid var(--line);border-left:4px solid;display:flex;gap:8px;align-items:flex-start}
.ditem b{display:block;font-size:13.5px}
.ditem small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.ditem .acts{margin-left:auto;display:flex}

/* deadlines */
.dlcards{display:flex;flex-direction:column;gap:10px}
.dl{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--edge);border-left:5px solid var(--line2)}
.dl.overdue{border-left-color:var(--bad)} .dl.soon{border-left-color:var(--warn)} .dl.later{border-left-color:var(--good)} .dl.isdone{opacity:.6}
.dl .when{font-family:var(--display);font-size:26px;line-height:1;text-align:center;min-width:54px}
.dl .when small{display:block;font-family:var(--body);font-size:10.5px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.dl b{font-size:15px}
.dl .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:5px;font-size:12.5px;color:var(--muted)}
.dl .notes{margin-top:6px;font-size:13px;color:#5a4640;white-space:pre-wrap;overflow-wrap:anywhere}
.dl .acts{display:flex;gap:2px;align-items:center}
.isdone b{text-decoration:line-through}

/* tasks */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.lane{display:flex;flex-direction:column;gap:10px}
.lanehead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;padding:0 4px}
.lanehead i{width:10px;height:10px;border-radius:50%}
.lanehead span{color:var(--muted);font-weight:600}
.task{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--edge);display:flex;flex-direction:column;gap:9px;box-shadow:0 10px 24px -22px rgba(80,30,10,.6)}
.task b{font-size:14px;overflow-wrap:anywhere}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.task input[type=range]{width:100%;accent-color:var(--red)}
.task .foot{display:flex;align-items:center;gap:4px}
.task .foot .pc{font-weight:700;font-size:12px;margin-right:auto;font-variant-numeric:tabular-nums}
.hero4{grid-template-columns:repeat(4,minmax(0,1fr))}
.overall{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.overall .prog{flex:1;min-width:160px;height:12px}
.overall .big{font-family:var(--display);font-size:38px;line-height:1}

/* schedule */
.serieslist{display:flex;flex-direction:column;gap:12px}
.sercard{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center}
.sercard .wk{font-family:var(--display);font-size:22px;text-transform:uppercase;line-height:1}
.sercard .wk small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);text-transform:none;margin-top:4px}
.sercard h4{margin:0 0 6px;font-size:17px}
.games{display:flex;gap:8px;flex-wrap:wrap}
.game{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 5px;border-radius:10px;background:rgba(255,255,255,.7);border:1px solid var(--line);font-size:12.5px;text-decoration:none}
.game:hover{border-color:rgba(var(--red-rgb),.4)}
.game .sc{font-weight:700;font-variant-numeric:tabular-nums}
.sres{text-align:right}
.sres b{font-family:var(--display);font-size:26px;display:block;line-height:1}

/* stats */
.leaders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.leader .v{font-family:var(--display);font-size:38px;line-height:1}
.leader .n{font-weight:600;margin-top:4px}
.leader small{color:var(--muted);font-size:12px}
.bars{display:flex;flex-direction:column;gap:7px}
.brow{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:12.5px}
.brow .bt{height:14px;border-radius:5px;background:rgba(90,40,25,.06);position:relative;overflow:hidden}
.brow .bt i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,rgba(var(--red-rgb),.55),var(--red))}

<body>

<script>
(()=>{
'use strict';
/* Two club passwords, stored only as hashes. They decide which tabs the page shows; who can actually read
   board data or change anything is enforced by Firebase (approved Google accounts, see firestore.rules). */
const BUILD='20261111-1700';
/* Two shared logins: the board password and the member password are checked by Firebase, never stored here */
const BOARD_COLS=['events','deadlines','tasks','dues','officerdues','forms'];
const ACCT={board:'board@badgerclub.example',member:'member@badgerclub.example'};
/* Firebase project settings (Project settings → Your apps → Web app). These identify the project and are safe to publish. */
const FIREBASE_CONFIG=null;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const todayS=()=>ymd(today());
const daysUntil=s=>Math.round((pd(s)-today())/864e5);
const fmtD=(s,o={month:'short',day:'numeric'})=>s?pd(s).toLocaleDateString('en-US',o):'';
const fmtT=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${pad(m)} ${ap}`};
const rel=n=>n===0?'Today':n===1?'Tomorrow':n===-1?'1 day overdue':n>0?`In ${n} days`:`${-n} days overdue`;
const first=n=>{const p=String(n||'').split(',');return p.length>1?`${p[1].trim()} ${p[0].trim()}`:String(n||'')};
const slug=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80)||'x';
const money=n=>'$'+(Math.round((Number(n)||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
const own=(o,k)=>o&&Object.prototype.hasOwnProperty.call(o,k);

const I={
 grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',

function drawBg(){
  const c=$('#bg');const dpr=Math.min(2,window.devicePixelRatio||1);const w=innerWidth,h=innerHeight;
  c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';
  const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
  const cx=-w*.04,cy=h*1.06,L=Math.max(w,h)*.62;
  for(let i=0;i<30;i++){const a=-Math.PI*.5+i*(Math.PI*.5/29);const ex=cx+Math.cos(a)*L,ey=cy+Math.sin(a)*L;
    const g=x.createLinearGradient(cx,cy,ex,ey);g.addColorStop(0,'rgba(232,140,70,0)');g.addColorStop(.55,'rgba(236,150,80,.26)');g.addColorStop(1,'rgba(252,215,170,.04)');
    x.strokeStyle=g;x.lineWidth=16;x.lineCap='round';x.beginPath();x.moveTo(cx,cy);x.lineTo(ex,ey);x.stroke();}
  const R=Math.min(w,h)*.34,bx=w-R*.3,by=R*.22;
  const bg=x.createRadialGradient(bx-R*.35,by-R*.35,R*.1,bx,by,R);bg.addColorStop(0,'rgba(255,255,255,.95)');bg.addColorStop(1,'rgba(238,214,198,.85)');
  x.fillStyle=bg;x.beginPath();x.arc(bx,by,R,0,Math.PI*2);x.fill();
  x.save();x.beginPath();x.arc(bx,by,R,0,Math.PI*2);x.clip();
  [[bx-R*1.5,by+R*.15],[bx+R*1.5,by-R*.15]].forEach(([sx,sy])=>{const sr=R*1.04;
    x.strokeStyle='rgba(197,5,12,.42)';x.lineWidth=2;x.beginPath();x.arc(sx,sy,sr,0,Math.PI*2);x.stroke();
    for(let t=0;t<Math.PI*2;t+=.075){const px=sx+Math.cos(t)*sr,py=sy+Math.sin(t)*sr;if(Math.hypot(px-bx,py-by)>R*.96)continue;
      const nx=Math.cos(t),ny=Math.sin(t),tx=-ny,ty=nx,k=R*.035;
      x.beginPath();x.moveTo(px+nx*k*1.6-tx*k,py+ny*k*1.6-ty*k);x.lineTo(px,py);x.lineTo(px-nx*k*1.6-tx*k,py-ny*k*1.6-ty*k);x.stroke();}
  });x.restore();
}

async function write(fn){
  if(S.mode!=='board'){toast('Members can view only. Enter the board password to make changes.');return false}
  if(!S.db){toast('The club database isn’t connected yet.');return false}
  try{await fn();return true}catch(e){
    const c=e&&e.code;
    if(c==='quota_exceeded'||c==='resource-exhausted')toast('The free database limit for today is used up. Try again tomorrow.');
    else if(c==='permission-denied')toast('That change wasn’t allowed. Lock the dashboard and enter the board password again.');
    else if(c==='invalid_argument'||c==='invalid-argument')toast('That could not be saved. The item may be too large.');
    else if(c==='unavailable'){try{await new Promise(r=>setTimeout(r,600+Math.random()*600));await fn();return true}catch(_){toast('Connection hiccup. Try again in a moment.')}}
    else toast('Could not save. Try again.');
    return false}
}

  try{

    FB={F,fs,auth};
    const wrapSnap=s=>({metadata:s.metadata,docs:s.docs.map(d=>({id:d.id,data:()=>dec(d.data())}))});
    S.db={
      collection:c=>({add:d=>F.addDoc(F.collection(fs,c),enc(d)),onSnapshot:(ok,err)=>F.onSnapshot(F.collection(fs,c),{includeMetadataChanges:true},s=>ok(wrapSnap(s)),err)}),
      doc:p=>({set:d=>F.setDoc(F.doc(fs,p),enc(d)),update:d=>F.updateDoc(F.doc(fs,p),enc(d)),delete:()=>F.deleteDoc(F.doc(fs,p))})

    F.onAuthStateChanged(auth,u=>{

      S.authed=mode;S.capsDone=true;S.gToken=null;

/* A Google access token for reading the board's form-response sheets (asked for only when syncing) */
async function googleToken(interactive){
  if(S.gToken&&S.gToken.exp>Date.now()+60e3)return S.gToken.t;
  if(!interactive||!FB)throw {code:'needs_token'};
  const p=new FB.F.GoogleAuthProvider();p.addScope('https://www.googleapis.com/auth/spreadsheets.readonly');p.addScope('https://www.googleapis.com/auth/drive.metadata.readonly');
  p.setCustomParameters({prompt:'select_account'});
  if(!FB.gauth)FB.gauth=FB.F.getAuth(FB.F.initializeApp(FIREBASE_CONFIG,'google-sheets'));
  const r=await FB.F.signInWithPopup(FB.gauth,p);const cred=FB.F.GoogleAuthProvider.credentialFromResult(r);
  FB.F.signOut(FB.gauth).catch(()=>{});
  if(!cred||!cred.accessToken)throw {code:'needs_token'};
  S.gToken={t:cred.accessToken,exp:Date.now()+50*60e3};return S.gToken.t;
}
async function gapi(url,interactive){
  const t=await googleToken(interactive);const r=await fetch(url,{headers:{Authorization:'Bearer '+t}});
  if(r.status===401){S.gToken=null;throw {code:'needs_token'}}
  if(!r.ok){let m='';try{m=(await r.json()).error?.message||''}catch(_){};throw {code:r.status===403?(/has not been used|is disabled/i.test(m)?'api_off':'no_access'):r.status===404?'not_found':'google_error'}}

}
function subscribe(c){

  const pts=vals.map((v,i)=>[vals.length===1?w/2:i*(w-6)/(vals.length-1)+3,h-4-(v-mn)/rg*(h-10)]);
  const line=pts.map(p=>p.join(',')).join(' ');const z=h-4-(0-mn)/rg*(h-10);const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b9257" stop-opacity=".28"/><stop offset="1" stop-color="#2b9257" stop-opacity="0"/></linearGradient></defs><line x1="0" x2="${w}" y1="${z}" y2="${z}" stroke="rgba(90,40,25,.15)" stroke-dasharray="3 3"/><polygon points="${pts[0][0]},${z} ${line} ${last[0]},${z}" fill="url(#sg)"/><polyline points="${line}" fill="none" stroke="#2b9257" stroke-width="2" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="#2b9257" stroke="#fff" stroke-width="1.5"/></svg>`}
function standingsTable(compact){const d=T();const s=d?.standings||[];return `<div class="tw"><table class="t std num"><thead><tr><th>Team</th><th>Conf</th>${compact?'':'<th>Conf %</th>'}<th>Overall</th>${compact?'':'<th>Home</th><th>Away</th><th>RF</th><th>RA</th>'}<th>Strk</th></tr></thead><tbody>${s.map(r=>`<tr class="${r.team===d.usName?'us':''}"><td>${esc(r.team)}</td><td>${esc(r.confW)}-${esc(r.confL)}</td>${compact?'':`<td>${esc(r.confPct)}</td>`}<td>${esc(r.W)}-${esc(r.L)}</td>${compact?'':`<td>${esc(r.home)}</td><td>${esc(r.away)}</td><td>${esc(r.rf)}</td><td>${esc(r.ra)}</td>`}<td>${esc(r.streak)}</td></tr>`).join('')}</tbody></table></div>`}
const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};

function upcomingItems(n=7){
  const t=todayS();const items=[];
  if(isBoard())S.events.filter(e=>e.date>=t).forEach(e=>items.push({d:e.date,tm:e.start||'',time:e.start?fmtT(e.start):'All day',title:e.title,team:e.team,sub:[e.type,e.location].filter(Boolean).join(' · '),color:evColor(e.type)}));
  if(isBoard())openDeadlines().filter(d=>d.due>=t).forEach(d=>items.push({d:d.due,tm:d.time||'99',time:d.time?fmtT(d.time):'Due',title:'Deadline: '+d.title,sub:d.owner||'',color:'#d23a2e'}));
  TEAMS.forEach(tm=>seriesList(tm).filter(s=>s.end>=t&&!s.games.some(g=>g.result)).forEach(s=>items.push({d:s.start,tm:'00',time:'Week',team:tm,title:`Series ${s.home?'vs':'at'} ${s.opponent}`,sub:`${s.week} · ${fmtD(s.start)}–${fmtD(s.end)} · ${s.games.length} games`,color:'#7a1f1a'})));
  S.carpools.filter(c=>c.date&&c.date>=t).forEach(c=>items.push({d:c.date,tm:c.depart||'00',time:c.depart?fmtT(c.depart):'Trip',team:c.team,title:'Carpool: '+(c.title||'Trip'),sub:c.meet?'Meet at '+c.meet:'',color:'#3a74c9'}));
  return items.sort((a,b)=>(a.d+a.tm).localeCompare(b.d+b.tm)).slice(0,n);
}

  return `
  <div class="hero">
    <div class="card hello"><div style="display:flex;gap:10px;align-items:center"><div class="av">B</div><span class="pill p-neutral">${esc(fmtD(todayS(),{weekday:'long',month:'long',day:'numeric'}))}</span>${tchip(S.team)}</div>
      <div><h2>Hey Badger</h2><div class="sub" style="margin-top:4px">${isBoard()?(u.length?`${u.length} deadline${u.length>1?'s':''} due within a week`:'No deadlines due this week'):'Welcome to Badger Club Baseball'}${next?` · Next ${S.team} series ${next.home?'vs':'at'} ${esc(next.opponent)}, week of ${fmtD(next.start)}`:''}</div></div></div>
    <div class="card kpi"><span class="lab">${S.team} overall record</span><div class="row"><div><div class="big num">${r.w}-${r.l}</div><div class="sub">${us?`${esc(us.confW)}-${esc(us.confL)} conf · ${ord(rank)} in ${esc(d.conference.replace(' - ',' '))}`:''}</div></div>${spark(rd)}</div><span class="delta ${cum>=0?'up':'down'}">${cum>=0?'+':''}${cum} run differential</span></div>
    <div class="card kpi"><span class="lab">${S.team} hitting</span><div class="big num">${esc(trim(hv('AVG')))}</div><div class="sub">AVG · ${esc(trim(hv('OBP')))} OBP · ${esc(trim(hv('OPS')))} OPS</div><span class="delta up">${esc(hv('R'))} runs · ${esc(hv('SB'))} steals</span></div>
    <div class="card kpi"><span class="lab">${S.team} pitching</span><div class="big num">${esc(pv('ERA'))}</div><div class="sub">ERA · ${esc(pv('WHIP'))} WHIP · ${esc(pv('SO'))} K</div><span class="delta up">${esc(pv('K/BB'))} K/BB · ${esc(pv('HR'))} HR allowed</span></div>
  </div>
  <div class="ovgrid">
    <div class="col">
      ${isBoard()?`<div class="card"><div class="ch"><h3>Upcoming deadlines</h3>${E(`<button class="btn sm pri" data-act="add-deadline" type="button">${ic('plus')}Add</button>`)}<button class="link" data-nav="deadlines" type="button">All deadlines ${ic('right')}</button></div>
        ${loadingOr('deadlines',dls.length?`<div class="tw"><table class="t"><thead><tr><th></th><th>Deadline</th><th>Owner</th><th>Due</th><th>Priority</th></tr></thead><tbody>${dls.map(x=>{const n=x.due?daysUntil(x.due):null;return `<tr><td style="width:28px">${chk(false,`data-act="toggle-dl" data-id="${esc(x.id)}" aria-label="Mark ${esc(x.title)} done"`)}</td><td class="ttl">${esc(x.title)}</td><td class="sub">${esc(x.owner||'–')}</td><td class="num" style="white-space:nowrap">${x.due?`${fmtD(x.due)}${x.time?' · '+fmtT(x.time):''}<div class="sub" style="color:${n<0?'var(--bad)':n<=3?'var(--warn)':'var(--muted)'}">${rel(n)}</div>`:'–'}</td><td>${priPill(x.priority)}</td></tr>`}).join('')}</tbody></table></div>`:'','No open deadlines. Add one with the Add button.')}
      </div>`:''}
      <div class="card"><div class="ch"><h3>Announcements</h3>${E(`<button class="btn sm" data-act="add-ann" type="button">${ic('plus')}Post</button>`)}</div>
        ${loadingOr('announcements',`<div class="ann">${anns.map(a=>`<div class="annitem"><div style="color:var(--red);flex:none">${ic('mega','width="18" height="18"')}</div><div style="min-width:0"><p>${esc(a.text)}</p><small>${a.createdAt?new Date(a.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric'}):''}</small></div>${E(`<button class="mini x" data-act="del-ann" data-id="${esc(a.id)}" aria-label="Delete announcement" type="button">${ic('trash')}</button>`)}</div>`).join('')}</div>`,'Nothing posted yet.')}
      </div>
      <div class="card"><div class="ch"><h3>${esc(d?d.conference.replace(' - ',' – '):'')} standings ${tchip(S.team)}</h3><button class="link" data-nav="schedule" type="button">Schedule ${ic('right')}</button></div>${d?standingsTable(true):'<div class="empty">Loading…</div>'}</div>

        <div class="plist">

          ${!isBoard()?'':tasks.filter(t=>t.status!=='done').sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).slice(0,3).map(t=>`<div class="prow"><div class="top2"><span style="color:var(--ink)">${esc(t.title)}</span><span>${taskPct(t)}%</span></div><div class="prog"><i style="width:${taskPct(t)}%"></i></div></div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

/* ---------- calendar ---------- */
function vCalendar(){
  const {y,m,sel}=S.cal;const f=new Date(y,m,1);const startOff=(f.getDay()+6)%7;const start=new Date(y,m,1-startOff);
  const last=new Date(y,m+1,0);const weeks=Math.ceil((startOff+last.getDate())/7);const t=todayS();
  const ser=[...seriesList('D1'),...seriesList('D2')];
  const dayItems=ds=>{const ev=S.events.filter(e=>e.date===ds).sort((a,b)=>(a.start||'').localeCompare(b.start||'')).map(e=>({kind:'ev',d:e,color:evColor(e.type),label:(e.team&&e.team!=='Club'?e.team+' ':'')+(e.start?fmtT(e.start).replace(':00','')+' ':'')+e.title}));
    const dl=S.deadlines.filter(d=>d.due===ds).map(d=>({kind:'dl',d,color:'#d23a2e',label:'Due: '+d.title}));
    const cp=S.carpools.filter(c=>c.date===ds).map(c=>({kind:'cp',d:c,color:'#3a74c9',label:'Carpool: '+(c.title||'Trip')}));return ev.concat(dl,cp)};
  let html='';
  for(let w=0;w<weeks;w++){
    const ws=new Date(start);ws.setDate(start.getDate()+w*7);const we=new Date(ws);we.setDate(ws.getDate()+6);
    const wsS=ymd(ws),weS=ymd(we);const sr=ser.filter(s=>s.start<=weS&&s.end>=wsS);
    html+=`<div class="week">${sr.map(s=>`<div class="series">${tchip(s.team)} ${esc(s.week)}: Series ${s.home?'vs':'at'} ${esc(s.opponent)} <span>${s.games.length} games${s.games.some(g=>g.result)?' · '+s.games.map(g=>g.result).join('-'):' · days and times TBA on NCBA'}</span></div>`).join('')}<div class="days">`;
    for(let d=0;d<7;d++){const dt=new Date(ws);dt.setDate(ws.getDate()+d);const ds=ymd(dt);const it=dayItems(ds);
      html+=`<button type="button" class="day ${dt.getMonth()!==m?'out':''} ${ds===t?'today':''} ${ds===sel?'sel':''}" data-day="${ds}" aria-label="${esc(fmtD(ds,{weekday:'long',month:'long',day:'numeric'}))}, ${it.length} item${it.length===1?'':'s'}"><span class="dn">${dt.getDate()}</span>${it.slice(0,3).map(i=>`<span class="ev" style="border-color:${i.color};background:${i.color}1a;color:${i.color}">${esc(i.label)}</span>`).join('')}${it.length>3?`<span class="more">+${it.length-3} more</span>`:''}</button>`}
    html+='</div></div>';
  }
  const selItems=dayItems(sel);const selSer=ser.filter(s=>s.start<=sel&&s.end>=sel);
  return `<div class="pagehead"><div><h2>Club calendar</h2><p>Practices, meetings and events for D1, D2 and the whole club. NCBA series weeks for both teams show automatically.</p></div><div class="spacer"></div>${roNote()}${E(`<button class="btn pri" data-act="add-event" data-date="${sel}" type="button">${ic('plus')}Add event</button>`)}</div>
  <div class="calwrap">
    <div class="card"><div class="calhead"><button class="mini" data-act="cal-prev" aria-label="Previous month" type="button">${ic('left')}</button><h3>${f.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h3><button class="mini" data-act="cal-next" aria-label="Next month" type="button">${ic('right')}</button><button class="btn sm" data-act="cal-today" type="button">Today</button></div>
      <div class="dow">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<span>${d}</span>`).join('')}</div>${html}
      <div class="legend">${Object.entries(EVTYPES).map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join('')}<span><i style="background:#d23a2e"></i>Deadline</span><span><i style="background:#3a74c9"></i>Carpool</span></div></div>
    <div class="card"><div class="ch"><h3>${esc(fmtD(sel,{weekday:'long',month:'long',day:'numeric'}))}</h3></div>
      <div class="dlist">${selSer.map(s=>`<div class="ditem" style="border-left-color:#7a1f1a"><div><b>${tchip(s.team)} Series ${s.home?'vs':'at'} ${esc(s.opponent)}</b><small>${esc(s.week)} · ${fmtD(s.start)}–${fmtD(s.end)} · ${s.home?'Home':'Away'} · exact days TBA on NCBA</small></div></div>`).join('')}
      ${selItems.map(i=>i.kind==='ev'?`<div class="ditem" style="border-left-color:${i.color}"><div style="min-width:0"><b>${tchip(i.d.team)} ${esc(i.d.title)}</b><small>${i.d.start?fmtT(i.d.start)+(i.d.end?' – '+fmtT(i.d.end):''):'All day'} · ${esc(own(EVTYPES,i.d.type)?i.d.type:'Other')}${i.d.location?' · '+esc(i.d.location):''}</small>${i.d.notes?`<small>${esc(i.d.notes)}</small>`:''}</div>${E(`<div class="acts"><button class="mini" data-act="edit-event" data-id="${esc(i.d.id)}" aria-label="Edit event" type="button">${ic('edit')}</button><button class="mini" data-act="del-event" data-id="${esc(i.d.id)}" aria-label="Delete event" type="button">${ic('trash')}</button></div>`)}</div>`
        :i.kind==='dl'?`<div class="ditem" style="border-left-color:#d23a2e"><div><b>Due: ${esc(i.d.title)}</b><small>${esc(i.d.owner||'')}${i.d.time?' · '+fmtT(i.d.time):''}${i.d.done?' · Done':''}</small></div></div>`
        :`<div class="ditem" style="border-left-color:#3a74c9"><div><b>${tchip(i.d.team)} Carpool: ${esc(i.d.title||'Trip')}</b><small>${i.d.depart?fmtT(i.d.depart)+' · ':''}${esc(i.d.meet||'')}</small></div></div>`).join('')}
      ${!selItems.length&&!selSer.length?'<div class="empty">Nothing on this day.</div>':''}</div>
      ${E(`<button class="btn" style="margin-top:12px;width:100%;justify-content:center" data-act="add-event" data-date="${sel}" type="button">${ic('plus')}Add event on ${esc(fmtD(sel))}</button>`)}
    </div>
  </div>`;
}

/* ---------- deadlines ---------- */
function vDeadlines(){
  const f=S.dlFilter;const t=todayS();
  let list=[...S.deadlines];
  if(f==='upcoming')list=list.filter(d=>!d.done&&(!d.due||d.due>=t));else if(f==='overdue')list=list.filter(d=>!d.done&&d.due&&d.due<t);else if(f==='done')list=list.filter(d=>d.done);
  list.sort((a,b)=>f==='done'?(b.due||'').localeCompare(a.due||''):((a.due||'9')+(a.time||'')).localeCompare((b.due||'9')+(b.time||'')));
  const od=S.deadlines.filter(d=>!d.done&&d.due&&d.due<t).length;
  return `<div class="pagehead"><div><h2>Deadlines</h2><p>Board members add deliverables here. Anything due within a week shows on the overview and in the bell.</p></div><div class="spacer"></div>${roNote()}${E(`<button class="btn pri" data-act="add-deadline" type="button">${ic('plus')}Add deadline</button>`)}</div>
  <div><div class="seg" role="tablist">${[['upcoming','Upcoming'],['overdue',`Overdue${od?` (${od})`:''}`],['done','Done'],['all','All']].map(([k,l])=>`<button type="button" role="tab" aria-selected="${f===k}" class="${f===k?'on':''}" data-dlf="${k}">${l}</button>`).join('')}</div></div>
  ${loadingOr('deadlines',list.length?`<div class="dlcards">${list.map(d=>{const n=d.due?daysUntil(d.due):null;const cls=d.done?'isdone':n==null?'':n<0?'overdue':n<=3?'soon':'later';
    return `<div class="dl ${cls}"><div class="when num">${d.due?pd(d.due).getDate():'–'}<small>${d.due?fmtD(d.due,{month:'short'}):'No date'}</small></div>
      <div style="min-width:0"><b>${esc(d.title)}</b><div class="meta">${priPill(d.priority)}${d.owner?`<span>${esc(d.owner)}</span>`:''}${d.due?`<span style="color:${d.done?'var(--muted)':n<0?'var(--bad)':n<=3?'var(--warn)':'var(--muted)'};font-weight:600">${d.done?'Done':rel(n)}${d.time?' · '+fmtT(d.time):''}</span>`:''}</div>${d.notes?`<div class="notes">${esc(d.notes)}</div>`:''}</div>
      <div class="acts">${chk(d.done,`data-act="toggle-dl" data-id="${esc(d.id)}" aria-label="${d.done?'Reopen':'Mark done'}: ${esc(d.title)}"`)}${E(`<button class="mini" data-act="edit-deadline" data-id="${esc(d.id)}" aria-label="Edit deadline" type="button">${ic('edit')}</button><button class="mini" data-act="del-deadline" data-id="${esc(d.id)}" aria-label="Delete deadline" type="button">${ic('trash')}</button>`)}</div></div>`}).join('')}</div>`:`<div class="empty">${f==='overdue'?'Nothing overdue.':f==='done'?'No completed deadlines yet.':'No deadlines here yet.'}</div>`,'No deadlines yet.')}`;
}

/* ---------- tasks ---------- */
function vTasks(){
  const lanes=[['todo','To do','#a8958e'],['doing','In progress','#d9821a'],['done','Done','#2b9257']];
  const all=S.tasks;const avg=all.length?Math.round(all.reduce((s,t)=>s+taskPct(t),0)/all.length):0;const done=all.filter(t=>t.status==='done').length;
  const card=t=>{const p=taskPct(t);const n=t.due?daysUntil(t.due):null;return `<div class="task"><b>${esc(t.title)}</b><div class="meta">${priPill(t.priority)}${t.assignee?`<span>${esc(t.assignee)}</span>`:''}${t.due?`<span style="${t.status!=='done'&&n<0?'color:var(--bad);font-weight:600':''}">Due ${fmtD(t.due)}</span>`:''}</div>
    <div class="prog ${p===100?'good':''}"><i style="width:${p}%"></i></div>
    ${E(`<input type="range" min="0" max="100" step="5" value="${p}" data-act="task-pct" data-id="${esc(t.id)}" aria-label="Progress for ${esc(t.title)}">`)}
    <div class="foot"><span class="pc">${p}%</span>${E(`${t.status!=='todo'?`<button class="mini" data-act="task-move" data-dir="-1" data-id="${esc(t.id)}" aria-label="Move back" type="button">${ic('left')}</button>`:''}${t.status!=='done'?`<button class="mini" data-act="task-move" data-dir="1" data-id="${esc(t.id)}" aria-label="Move forward" type="button">${ic('right')}</button>`:''}<button class="mini" data-act="edit-task" data-id="${esc(t.id)}" aria-label="Edit task" type="button">${ic('edit')}</button><button class="mini" data-act="del-task" data-id="${esc(t.id)}" aria-label="Delete task" type="button">${ic('trash')}</button>`)}</div></div>`};
  return `<div class="pagehead"><div><h2>Task tracker</h2><p>${S.mode==='board'?'Drag a task’s slider to log progress. Reaching 100% moves it to Done.':'Progress on club jobs, updated by the board.'}</p></div><div class="spacer"></div>${roNote()}${E(`<button class="btn pri" data-act="add-task" type="button">${ic('plus')}Add task</button>`)}</div>
  <div class="card overall"><div><div class="sub">Overall completion</div><div class="big num">${avg}%</div></div><div class="prog good"><i style="width:${avg}%"></i></div><div class="sub">${done} of ${all.length} tasks done</div></div>
  ${loadingOr('tasks',`<div class="kanban">${lanes.map(([k,l,c])=>{const ts=all.filter(t=>(t.status||'todo')===k).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));return `<div class="lane"><div class="lanehead"><i style="background:${c}"></i>${l} <span>${ts.length}</span></div>${ts.map(card).join('')||'<div class="empty">Empty</div>'}</div>`}).join('')}</div>`,'No tasks yet.')}`;
}

/* ---------- schedule ---------- */
function vSchedule(){

const ipfmt=v=>{const x=num(v);const w=Math.floor(x+1e-9);const frac=Math.round((x-w)*100);return `${w}.${frac===10?1:frac===20?2:0}`};
const trim3=v=>String(v).replace(/^0\./,'.');
function vStats(){

    leaders=[['ERA',top('ERA',q,true),'Earned run avg · min 5 IP',x=>x,q],['SO',top('SO',rows),'Strikeouts',x=>x,rows],['W',top('W',rows),'Wins',x=>x,rows],['WHIP',top('WHIP',q,true),'WHIP · min 5 IP',x=>x,q]];

 AVG:{l:'Batting avg',f:v=>trim3(v.toFixed(3)),hi:true,g:'h'},OBP:{l:'On-base pct',f:v=>trim3(v.toFixed(3)),hi:true,g:'h'},SLG:{l:'Slugging pct',f:v=>trim3(v.toFixed(3)),hi:true,g:'h'},

 SBPCT:{l:'Steal success',d:'SB / (SB + CS)',f:v=>(v*100).toFixed(0)+'%',hi:true,g:'h'},

  const opp=s.opponent;const od=own(d.opp,opp)?d.opp[opp]:null;const oR=od&&od.rates;const us=d.compare.us;const nat=d.compare.nat;
  const oRow=d.standings.find(x=>x.team===opp);const oInfo=own(d.oppInfo,opp)?d.oppInfo[opp]:null;const usR=usRow();const rec=record();

/* ---------- national ---------- */
function natTable(){const d=T();const n=d&&d.national;if(!n)return null;
  const rows=n.teams.map(([name,conf,w,l,t,rf,ra])=>{const g=w+l+t;return {name,conf,w,l,t,g,rf,ra,pct:g?(w+t/2)/g:0,rfg:g?rf/g:0,rag:g?ra/g:0,rdg:g?(rf-ra)/g:0}});
  rows.sort((a,b)=>b.pct-a.pct||b.rdg-a.rdg||b.w-a.w);return rows}
function natStatRows(){const d=T();const n=d&&d.national;if(!n||!n.teamStats)return [];const ci=k=>n.statCols.indexOf(k);const conf={};(n.teams||[]).forEach(t=>conf[t[0]]=t[1]);
  return n.teamStats.map(r=>{const g=k=>r[ci(k)]||0;const AB=g('AB'),H=g('H'),BB=g('BB'),HBP=g('HBP'),SF=g('SF'),TB=g('TB'),PA=g('PA'),O=g('OUTS');
    const obp=AB+BB+HBP+SF?(H+BB+HBP)/(AB+BB+HBP+SF):null,slg=AB?TB/AB:null;
    return {team:r[0],conf:conf[r[0]]||'',AB,R:g('R'),H,HR:g('HR'),RBI:g('RBI'),SB:g('SB'),BB,SO:g('SO'),AVG:AB?H/AB:null,OBP:obp,SLG:slg,OPS:obp!=null&&slg!=null?obp+slg:null,KPCT:PA?g('SO')/PA:null,BBPCT:PA?BB/PA:null,
      IP:O/3,ERA:O?g('ER')*27/O:null,WHIP:O?(g('HA')+g('BBA'))*3/O:null,K9:O?g('K')*27/O:null,BB9:O?g('BBA')*27/O:null,K:g('K')}})}
const NSC=[['team','Team'],['conf','Conference'],['AB','AB'],['R','R'],['H','H'],['HR','HR'],['RBI','RBI'],['SB','SB'],['AVG','AVG'],['OBP','OBP'],['SLG','SLG'],['OPS','OPS'],['KPCT','K%'],['BBPCT','BB%'],['IP','IP'],['ERA','ERA'],['WHIP','WHIP'],['K','K'],['K9','K/9'],['BB9','BB/9']];
const NSC_LOW=new Set(['KPCT','ERA','WHIP','BB9']);

        <div class="seats" aria-label="${rs.length} of ${n} seats filled">${Array.from({length:Math.max(n,rs.length)},(_,i)=>`<i class="${i<rs.length?'f':''}"></i>`).join('')}</div>
        <ul class="riders">${rs.map((r,i)=>`<li>${esc(r)}${E(`<button class="mini" data-act="rider-del" data-id="${esc(c.id)}" data-car="${esc(car.id)}" data-i="${i}" aria-label="Remove ${esc(r)}" type="button">${ic('x')}</button>`)}</li>`).join('')||'<li class="sub">No riders yet</li>'}</ul>

/* ---------- officer dues ---------- */
function officerRows(){const c=duesCfg();const base=Number(c.officerAmount)||0;const om=officerMap();const pm=allPeople();const out=[];
  const mk=(id,coll,name,role,teams,r)=>{const owed=r.owed!==undefined&&r.owed!==null&&r.owed!==''?Number(r.owed)||0:base;const paid=Number(r.paid)||0;
    const status=r.waived?'waived':owed<=0?(paid>0?'paid':'unset'):paid>=owed?'paid':paid>0?'partial':'unpaid';return {id,coll,name,role,teams,r,owed,paid,status}};
  om.forEach(o=>{const p=pm.get(o.key);out.push(mk(o.key,'dues',p?p.name:o.name,o.role,p?p.teams:[],S.dues.find(x=>x.id===o.key)||{}))});
  S.board.filter(b=>!b.playerKey).forEach(b=>out.push(mk(b.id,'officerdues',b.name,b.role||'',[],S.officerdues.find(x=>x.id===b.id)||{})));
  return out.sort((a,b)=>String(a.role).localeCompare(b.role)||String(a.name).localeCompare(b.name))}

  const c=duesCfg();const rows=officerRows();const act=rows.filter(r=>r.status!=='waived'&&r.status!=='unset');

  ${!c.officerAmount&&S.loaded.settings?`<div class="banner">Set the officer amount in Officer dues settings. Each officer can also have their own amount.</div>`:''}

    <div class="card kpi"><span class="lab">Officers</span><div class="big num">${rows.length}</div><div class="sub">labeled players and board members</div></div>
    <div class="card kpi"><span class="lab">Paid in full</span><div class="big num" style="color:var(--good)">${rows.filter(r=>r.status==='paid').length}</div></div>
    <div class="card kpi"><span class="lab">Still owe</span><div class="big num" style="color:var(--bad)">${rows.filter(r=>r.status==='unpaid'||r.status==='partial').length}</div><div class="sub">${money(owed-paid)} outstanding</div></div>

    ${rows.map(x=>`<tr><td class="ttl">${esc(first(x.name))} ${x.teams.map(tchip).join(' ')}</td><td class="sub">${esc(x.role||'')}</td><td>${money(x.owed)}${x.r.owed!==undefined&&x.r.owed!==null&&x.r.owed!==''?' <span class="tchip">custom</span>':''}</td><td>${money(x.paid)}</td><td><span class="pill st-${x.status}">${lab[x.status]}</span></td><td class="sub">${esc(x.r.method||'')}</td><td class="sub">${x.r.date?fmtD(x.r.date):''}</td><td class="sub" style="max-width:220px;overflow-wrap:anywhere">${esc(x.r.notes||'')}</td>${E(`<td><button class="btn sm" data-act="${x.coll==='dues'?'dues-edit':'odues-edit'}" data-id="${esc(x.id)}" data-key="${esc(x.id)}" data-name="${esc(x.name)}" type="button">Record</button></td>`)}</tr>`).join('')}
  </tbody></table></div>`:'<div class="empty">No officers yet. Label players as officers on the Roster tab (Label button), or add people to the Club board list.</div>','')}</div>`;
}

        <div class="pl2"><div><b>What’s loaded</b><small>${d.roster.length} players · ${d.games.length} games · ${d.hitting.rows.length} hitters · ${d.pitching.rows.length} pitchers</small></div><div class="st">${record(t).w}-${record(t).l}</div></div>

const GS='Google Sheets',GS_RANGE='A1:ZZ5000';
const sheetIdFrom=u=>{const m=String(u||'').match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]{20,})/);return m?m[1]:(/^[a-zA-Z0-9_-]{30,}$/.test(String(u||'').trim())?String(u).trim():null)};
function pickKeys(schema){const props=schema&&schema.properties||{};const p=Object.keys(props);
  const id=p.find(k=>/spreadsheet.?id/i.test(k))||p.find(k=>/(file|sheet|document).?id|^id$/i.test(k))||p.find(k=>/url/i.test(k))||p[0];
  const range=p.find(k=>/^ranges?$/i.test(k))||p.find(k=>/range|a1/i.test(k));
  return {id,range,rangeArray:!!(range&&props[range]&&props[range].type==='array'),url:!!(id&&/url/i.test(id))}}
function find2D(x,depth=0){if(depth>6||x==null)return null;if(Array.isArray(x)){if(x.length&&x.every(Array.isArray))return x;for(const v of x){const r=find2D(v,depth+1);if(r)return r}return null}
  if(typeof x==='object'){if(Array.isArray(x.values)&&x.values.every(Array.isArray))return x.values;for(const v of Object.values(x)){const r=find2D(v,depth+1);if(r)return r}}return null}
async function readSheet(form,interactive){
  const res=await gapi(`https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(form.sheetId)}/values/${encodeURIComponent(GS_RANGE)}?majorDimension=ROWS`,interactive);
  const g=(res.values||[]);if(!g.length)throw {code:'empty'};
  return g.map(r=>r.map(v=>v==null?'':String(v)));
}
async function readSheetViaClaude(form){
  const mcp=await window.claude?.use?.('mcp');if(!mcp)throw {code:'no_mcp'};
  const id=form.sheetId;const build=k=>{const o={};o[k.id]=k.url?form.sheetUrl:id;if(k.range)o[k.range]=k.rangeArray?[GS_RANGE]:GS_RANGE;return o};
  const call=input=>mcp.callTool(GS,'get_values',input,{cache:false});
  let res;
  if(S.gsKeys)res=await call(build(S.gsKeys));
  else{try{res=await call({spreadsheetId:id,range:GS_RANGE})}catch(e){if(!e||!['tool_error','bad_request'].includes(e.code))throw e;const d=await mcp.describeTool(GS,'get_values');S.gsKeys=pickKeys(d.inputSchema);res=await call(build(S.gsKeys))}}
  let grid=find2D(res&&res.payload);
  if(!grid&&typeof res?.payload==='string')grid=parseDelimited(res.payload);
  if(!grid){const t=(res?.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');try{grid=find2D(JSON.parse(t))}catch(_){grid=t?parseDelimited(t):null}}
  if(!grid||grid.length<1)throw {code:'empty'};
  return grid.map(r=>r.map(v=>v==null?'':String(v)));
}
const gsMsg=e=>{const c=e&&e.code;return c==='needs_token'?'Press Sync and allow Google Sheets access when Google asks.'

  :c==='needs_reauth'?'Reconnect Google Sheets in claude.ai Settings → Connectors, then press Sync again.'

async function syncForm(id,quiet){

    const known=new Set([...S.forms.map(f=>f.sheetId).filter(Boolean),...(Array.isArray(cfg.hidden)?cfg.hidden.map(h=>h&&h.id):[])]);const fresh=files.filter(f=>f&&f.id&&!known.has(f.id));

function parseDelimited(text){
  text=text.replace(/^﻿/,'').replace(/\r\n?/g,'\n');const firstLine=text.split('\n')[0]||'';
  const delim=(firstLine.match(/\t/g)||[]).length>(firstLine.match(/,/g)||[]).length?'\t':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"'&&f==='')q=true;else if(c===delim){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function importForm(existing){
  modal({title:existing?`Replace “${existing.name}”`:'Add a form',submit:'Import',wide:true,body:`
    <div class="field"><label for="i-name">Name for this response set</label><input class="inp" id="i-name" name="name" required maxlength="80" value="${esc(existing?.name||'')}" placeholder="Spring tryout sign-ups"></div>
    ${existing?'':`<div class="field"><label for="i-sheet">Google Sheet with the form’s responses (syncs automatically)</label><input class="inp" id="i-sheet" name="sheet" placeholder="https://docs.google.com/spreadsheets/d/…"></div><p class="sub" style="margin:-4px 0 0">Or, without a Google connection:</p>`}
    <div class="field"><label for="i-file">Upload the .csv export</label><input class="inp" type="file" id="i-file" accept=".csv,.tsv,text/csv,text/tab-separated-values" style="padding:8px"></div>
    <div class="field"><label for="i-paste">Or paste the cells from Google Sheets</label><textarea class="inp" id="i-paste" name="paste" placeholder="Select all the cells in the responses sheet, copy, and paste here" style="min-height:140px;font-size:12.5px"></textarea></div>
    <p class="sub" style="margin:0">The first row should be the question headers. Everyone who can open this dashboard will see the responses.</p>`,
    onSubmit:async(d,form)=>{
      if(!d.name.trim()){toast('Name the response set.');return false}
      if(!existing&&d.sheet&&d.sheet.trim()){const sid=sheetIdFrom(d.sheet);if(!sid){toast('Paste the Google Sheet address (docs.google.com/spreadsheets/d/…).');return false}
        let nid=null;const ok=await write(async()=>{const ref=await S.db.collection('forms').add({name:d.name.trim(),sheetId:sid,sheetUrl:d.sheet.trim(),columns:[],rows:[],importedAt:Date.now(),createdAt:Date.now()});nid=ref.id});
        if(ok&&nid){S.formSel=nid;setTimeout(()=>syncForm(nid),300)}return ok}
      let text=d.paste||'';const file=$('#i-file',form).files[0];if(file){try{text=await file.text()}catch(e){toast('That file could not be read.');return false}}
      if(!text.trim()){toast('Paste a Google Sheet address, upload a .csv, or paste the cells.');return false}
      const rows=parseDelimited(text);if(rows.length<2){toast('Need a header row and at least one response.');return false}
      const columns=rows[0].map((c,i)=>c.trim()||`Column ${i+1}`);const body=rows.slice(1).map(r=>columns.map((_,i)=>String(r[i]??'').slice(0,2000)));
      const v={name:d.name.trim(),columns,rows:body,importedAt:Date.now()};
      if(JSON.stringify(v).length>240000){toast('That export is too large for one set. Split it into smaller sets.');return false}
      const ok=existing?await write(()=>S.db.doc('forms/'+existing.id).set({...v,createdAt:existing.createdAt||Date.now()})):await write(async()=>{const ref=await S.db.collection('forms').add({...v,createdAt:Date.now()});S.formSel=ref.id});
      if(ok)toast(`Imported ${body.length} responses.`);return ok}});
}

function renderResults(){
  const q=$('#q').value.trim().toLowerCase();const box=$('#results');if(!q){box.hidden=true;return}
  const out=[];
  TEAMS.forEach(t=>rosterOf(t).forEach(p=>{if((p.name+' '+p.num+' '+p.pos+' '+first(p.name)).toLowerCase().includes(q))out.push(['roster',`#${p.num||'–'} ${first(p.name)}`,`${t} roster`,first(p.name),null,t])}));
  if(isBoard())S.deadlines.forEach(d=>{if((d.title+' '+(d.owner||'')).toLowerCase().includes(q))out.push(['deadlines',d.title,'Deadline'])});
  if(isBoard())S.tasks.forEach(t=>{if((t.title+' '+(t.assignee||'')).toLowerCase().includes(q))out.push(['tasks',t.title,'Task'])});
  if(isBoard())S.events.forEach(e=>{if((e.title+' '+(e.location||'')).toLowerCase().includes(q))out.push(['calendar',e.title,fmtD(e.date),null,e.date])});
  TEAMS.forEach(t=>seriesList(t).forEach(s=>{if(s.opponent.toLowerCase().includes(q))out.push(['matchups',`${s.home?'vs':'at'} ${s.opponent}`,`${t} · ${s.week}`,null,null,t,s.week+'|'+s.opponent])}));
  S.carpools.forEach(c=>{if((c.title||'').toLowerCase().includes(q))out.push(['carpools','Carpool: '+c.title,fmtD(c.date)])});
  box.innerHTML=out.slice(0,12).map((r,i)=>`<button type="button" data-ri="${i}">${esc(r[1])}<small>${esc(r[2])}</small></button>`).join('')||'<div class="sub" style="padding:10px">No matches.</div>';
  box.hidden=false;box._r=out;
}

$('#results').addEventListener('click',e=>{const b=e.target.closest('[data-ri]');if(!b)return;const r=$('#results')._r[+b.dataset.ri];
  if(r[5])setTeam(r[5],true);
  if(r[0]==='roster'){S.rq=r[3];S.rpos='all';S.ryr='all'}if(r[0]==='calendar'&&r[4]){const dt=pd(r[4]);S.cal={y:dt.getFullYear(),m:dt.getMonth(),sel:r[4]}}
  if(r[0]==='matchups'&&r[6])S.mSel[S.team]=r[6];
  if(r[0]==='deadlines')S.dlFilter='all';$('#q').value='';$('#results').hidden=true;go(r[0])});
document.addEventListener('click',e=>{if(!e.target.closest('#searchbox'))$('#results').hidden=true;if(!e.target.closest('#bell')&&!e.target.closest('#bellpop'))$('#bellpop').hidden=true});
function renderBell(){const u=urgent();$('#bellpop').innerHTML=`<h4>Due within a week</h4>${u.length?u.map(d=>{const n=daysUntil(d.due);return `<div class="ditem" style="border-left-color:${n<0?'var(--bad)':n<=3?'var(--warn)':'var(--good)'}"><div><b>${esc(d.title)}</b><small>${esc(d.owner||'')}${d.owner?' · ':''}${fmtD(d.due)} · ${rel(n)}</small></div></div>`}).join(''):'<div class="sub" style="padding:4px">Nothing due in the next 7 days.</div>'}<button class="btn sm" data-nav="deadlines" type="button" style="align-self:flex-start">All deadlines</button>`}
$('#bell').onclick=()=>{const p=$('#bellpop');p.hidden=!p.hidden;if(!p.hidden)renderBell()};
function setTeam(t,silent){if(!TEAMS.includes(t))return;S.team=t;ss.set('bcb-team',t);S.rq='';if(!silent)renderAll()}

/* ---------- event delegation ---------- */
const find=(c,id)=>S[c].find(x=>x.id===id);
const EDIT_ACTS=new Set(['add-event','edit-event','del-event','add-deadline','edit-deadline','del-deadline','toggle-dl','add-task','edit-task','del-task','task-move','add-board','edit-board','del-board','add-ann','del-ann','import-form','reimport','del-form','edit-scout','dues-settings','dues-add','dues-edit','dues-del','att-new','att-edit','att-del','att-allp','trip-new','trip-edit','trip-del','trip-from-series','car-add','car-edit','car-del','rider-del','need-del','odues-settings','odues-edit','refresh-request','src-edit','form-sync','form-link','folder-set','folder-scan','label-player','folder-hidden']);
document.addEventListener('click',async e=>{
  const nav=e.target.closest('[data-nav]');if(nav){$('#bellpop').hidden=true;go(nav.dataset.nav);return}
  const tm=e.target.closest('[data-team]');if(tm){setTeam(tm.dataset.team);return}
  const day=e.target.closest('[data-day]');if(day){S.cal.sel=day.dataset.day;renderAll();return}
  const t=e.target.closest('[data-dlf]');if(t){S.dlFilter=t.dataset.dlf;renderAll();return}
  const st=e.target.closest('[data-stab]');if(st){S.statTab=st.dataset.stab;renderAll();return}
  const ns=e.target.closest('[data-nsort]');if(ns){const s=S.natSort||(S.natSort={k:'OPS',d:-1});const k=ns.dataset.nsort;if(s.k===k)s.d*=-1;else{s.k=k;s.d=(k==='team'||k==='conf'||NSC_LOW.has(k))?1:-1}renderAll();return}
  const so=e.target.closest('[data-sort]');if(so){const s=S.sort[S.statTab];const k=so.dataset.sort;if(s.k===k)s.d*=-1;else{s.k=k;const lowGood=S.statTab==='pitching'&&['ERA','WHIP','L','H','R','ER','HR','BB','WPER9','HPER9','HBP','WP','BK'].includes(k);s.d=(k==='Player'||lowGood)?1:-1}renderAll();return}
  const rp=e.target.closest('[data-rpos]');if(rp){S.rpos=rp.dataset.rpos;renderAll();return}
  const ry=e.target.closest('[data-ryr]');if(ry){S.ryr=ry.dataset.ryr;renderAll();return}
  const fm=e.target.closest('[data-form]');if(fm){S.formSel=fm.dataset.form;S.formQ='';S.formFilter=null;renderAll();return}
  const ff=e.target.closest('[data-ff]');if(ff){const [fid,i]=ff.dataset.ff.split('|');const cur=S.formFilter;S.formFilter=cur&&cur.form===fid&&cur.i===+i&&cur.v===ff.dataset.fv?null:{form:fid,i:+i,v:ff.dataset.fv};renderAll();return}
  const fv=e.target.closest('[data-fview]');if(fv){S.formView=fv.dataset.fview;renderAll();return}
  const mu=e.target.closest('[data-matchup]');if(mu){S.mSel[S.team]=mu.dataset.matchup;go('matchups');return}
  const df=e.target.closest('[data-duesf]');if(df){S.duesF=df.dataset.duesf;renderAll();return}
  const dt=e.target.closest('[data-duest]');if(dt){S.duesT=dt.dataset.duest;renderAll();return}
  const se=e.target.closest('[data-sess]');if(se){S.sessSel[S.team]=se.dataset.sess;renderAll();return}
  const mk=e.target.closest('[data-mark]');if(mk){if(!canEdit())return;const s=find('attendance',mk.dataset.id);if(!s)return;const cur=(s.marks||{})[mk.dataset.key];const v=cur===mk.dataset.mark?'':mk.dataset.mark;updDoc('attendance',s.id,{marks:{[mk.dataset.key]:v}});return}
  const a=e.target.closest('[data-act]');if(!a||a.matches('input'))return;const id=a.dataset.id;const act=a.dataset.act;
  if(EDIT_ACTS.has(act)&&!canEdit()){toast(S.mode==='member'?'Members can view only. Enter the board password to make changes.':'Editing isn’t available with your current access.');return}
  switch(act){
    case 'add-event':return eventForm({},a.dataset.date);
    case 'edit-event':return eventForm(find('events',id)||{});
    case 'del-event':return confirmDel('this event',()=>delDoc('events',id));
    case 'cal-prev':{let{y,m}=S.cal;m--;if(m<0){m=11;y--}S.cal.y=y;S.cal.m=m;return renderAll()}
    case 'cal-next':{let{y,m}=S.cal;m++;if(m>11){m=0;y++}S.cal.y=y;S.cal.m=m;return renderAll()}
    case 'cal-today':{const d=today();S.cal={y:d.getFullYear(),m:d.getMonth(),sel:todayS()};return renderAll()}
    case 'add-deadline':return deadlineForm();
    case 'edit-deadline':return deadlineForm(find('deadlines',id)||{});
    case 'del-deadline':return confirmDel('this deadline',()=>delDoc('deadlines',id));
    case 'toggle-dl':{const d=find('deadlines',id);if(d)updDoc('deadlines',id,{done:!d.done});return}
    case 'add-task':return taskForm();
    case 'edit-task':return taskForm(find('tasks',id)||{});
    case 'del-task':return confirmDel('this task',()=>delDoc('tasks',id));
    case 'task-move':{const tk=find('tasks',id);if(!tk)return;const order=['todo','doing','done'];const i=Math.max(0,Math.min(2,order.indexOf(tk.status||'todo')+(+a.dataset.dir)));const ns=order[i];
      const p=ns==='done'?100:ns==='todo'?0:Math.min(95,Math.max(taskPct(tk),5));return updDoc('tasks',id,{status:ns,progress:p})}
    case 'add-board':return boardForm();
    case 'edit-board':return boardForm(find('board',id)||{});
    case 'del-board':return confirmDel('this board member',()=>delDoc('board',id));
    case 'add-ann':return annForm();
    case 'del-ann':return confirmDel('this announcement',()=>delDoc('announcements',id));
    case 'import-form':return importForm();
    case 'reimport':return importForm(find('forms',id));
    case 'del-form':{const f=find('forms',id);if(!f)return;return modal({title:`Remove “${f.name}” from the dashboard?`,submit:'Remove from dashboard',danger:true,body:`<p class="sub" style="margin:0">This only removes the list here. ${f.sheetId?'The Google Sheet, the Google Form and every response stay in your Google Drive untouched. The dashboard can only read from Google, never delete. ':''}${f.sheetId&&formsCfg().folderId?'The folder check will skip this sheet from now on, so it won’t come back. You can restore it later from the folder bar.':''}</p>`,
      onSubmit:async()=>{if(f.sheetId){const c=formsCfg();const hid=Array.isArray(c.hidden)?c.hidden.filter(h=>h&&h.id!==f.sheetId):[];hid.push({id:f.sheetId,name:f.name});const ok=await upsert('settings','forms',{hidden:hid.slice(-200)});if(!ok)return false}return delDoc('forms',id)}})}
    case 'form-sync':return syncForm(id);
    case 'folder-set':return folderForm();
    case 'label-player':return labelForm(a.dataset.key,a.dataset.name);
    case 'folder-hidden':return hiddenForm();
    case 'nat-toggle':S.natAll=!S.natAll;return renderAll();
    case 'folder-scan':return scanFolder(false);
    case 'form-link':{const f=find('forms',id);if(f)linkForm(f);return}
    case 'ff-clear':S.formFilter=null;return renderAll();
    case 'odues-settings':return oduesSettingsForm();
    case 'odues-edit':return oduesForm(id);
    case 'refresh-request':return refreshForm();
    case 'import-backup':return importBackup();
    case 'change-passwords':return changePasswords();
    case 'src-edit':return srcForm();
    case 'reload-data':toast('Reloading the latest data…');return loadData(true).then(()=>toast('Data reloaded.'));
    case 'edit-scout':return scoutForm(a.dataset.opp);
    case 'dues-settings':return duesSettingsForm();
    case 'dues-add':return duesAddForm();
    case 'dues-edit':return duesForm(a.dataset.key,a.dataset.name);
    case 'dues-del':return confirmDel('this member from dues',()=>delDoc('dues',a.dataset.key));
    case 'att-new':return sessionForm();
    case 'att-edit':return sessionForm(find('attendance',id)||{});
    case 'att-del':return confirmDel('this session',()=>delDoc('attendance',id));
    case 'att-allp':{const s=find('attendance',id);if(!s)return;const m={};rosterOf(s.team).forEach(p=>{if(!(s.marks||{})[p.key])m[p.key]='P'});if(Object.keys(m).length)updDoc('attendance',id,{marks:m});return}
    case 'trip-new':return tripForm();
    case 'trip-edit':return tripForm(find('carpools',id)||{});
    case 'trip-del':return confirmDel('this trip',()=>delDoc('carpools',id));
    case 'trip-from-series':{const [tm,wk,op]=a.dataset.s.split('|');const s=seriesList(tm).find(x=>x.week===wk&&x.opponent===op);return tripForm({},{title:`at ${op}`,team:tm,date:s?s.start:'',dest:op,series:a.dataset.s})}
    case 'car-add':return carForm(find('carpools',id)||{});
    case 'car-edit':{const tr=find('carpools',id);if(!tr)return;return carForm(tr,(tr.cars||[]).find(c=>c.id===a.dataset.car)||{})}
    case 'car-del':{const tr=find('carpools',id);if(!tr)return;return confirmDel('this car',()=>updDoc('carpools',id,{cars:(tr.cars||[]).filter(c=>c.id!==a.dataset.car)}))}
    case 'rider-del':{const tr=find('carpools',id);if(!tr)return;const cars=(tr.cars||[]).map(c=>c.id===a.dataset.car?{...c,riders:(c.riders||[]).filter((_,i)=>i!==+a.dataset.i)}:c);return updDoc('carpools',id,{cars})}
    case 'need-del':{const tr=find('carpools',id);if(!tr)return;return updDoc('carpools',id,{needs:(tr.needs||[]).filter((_,i)=>i!==+a.dataset.i)})}
  }
});
document.addEventListener('submit',e=>{const f=e.target;
  if(f.matches('[data-addrider]')){e.preventDefault();if(!canEdit())return;const [tid,cid]=f.dataset.addrider.split('|');const v=f.r.value.trim();if(!v)return;const tr=find('carpools',tid);if(!tr)return;
    const cars=(tr.cars||[]).map(c=>c.id===cid?{...c,riders:[...(c.riders||[]),v.slice(0,80)]}:c);updDoc('carpools',tid,{cars});f.r.value='';return}
  if(f.matches('[data-addneed]')){e.preventDefault();if(!canEdit())return;const tid=f.dataset.addneed;const v=f.r.value.trim();if(!v)return;const tr=find('carpools',tid);if(!tr)return;updDoc('carpools',tid,{needs:[...(tr.needs||[]),v.slice(0,80)]});f.r.value='';return}
});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='flatest'){S.formLatest=el.checked;renderAll();return}if(el.matches('[data-act="task-pct"]')){if(!canEdit())return;const p=+el.value;const tk=find('tasks',el.dataset.id);if(!tk)return;
  const st=p===100?'done':p===0?(tk.status==='done'?'doing':tk.status||'todo'):(tk.status==='todo'||tk.status==='done'?'doing':tk.status);updDoc('tasks',tk.id,{progress:p,status:st})}});
document.addEventListener('input',e=>{const el=e.target;
  if(el.matches('[data-act="task-pct"]')){const c=el.closest('.task');if(c){c.querySelector('.pc').textContent=el.value+'%';c.querySelector('.prog i').style.width=el.value+'%'}}
  const deb=(k)=>{S[k]=el.value;clearTimeout(el._t);el._t=setTimeout(renderAll,150)};
  if(el.id==='rq')deb('rq');if(el.id==='formq')deb('formQ');if(el.id==='duesq')deb('duesQ');
});

/* ---------- gate ---------- */
function unlock(mode){S.mode=mode;$('#gate').hidden=true;$('#app').hidden=false;const v=location.hash.slice(1);S.view=VIEWS.some(x=>x[0]===v)?v:'overview';renderAll()}
function showGate(){S.mode=null;$('#app').hidden=true;$('#gate').hidden=false;$('#pw').value='';gateReady();$('#pw').focus()}
function gateReady(){$('#gatebtn').disabled=false;$('#gatebtn').textContent='Enter dashboard';if(S.capsDone&&!S.db)$('#gateerr').textContent='The club database isn’t connected yet.'}
$('#gateform').onsubmit=async e=>{e.preventDefault();const v=$('#pw').value.trim().toLowerCase();if(!v)return;
  if(!FB){$('#gateerr').textContent=S.capsDone?'The club database isn’t connected yet.':'Still loading. Try again in a second.';return}
  const btn=$('#gatebtn');btn.disabled=true;btn.textContent='Checking…';$('#gateerr').textContent='';
  try{const mode=await passwordSignIn(v);
    if(mode){$('#pw').value='';unlock(mode)}else{$('#gateerr').textContent='That password isn’t right. Ask a board member for it.';$('#pw').select()}}
  catch(err){$('#gateerr').textContent=err&&err.code==='auth/too-many-requests'?'Too many tries. Wait a few minutes and try again.':'Couldn’t reach the club database. Check your connection.'}
  btn.disabled=false;btn.textContent='Enter dashboard'};
$('#lockbtn').onclick=()=>lockNow();
initCaps();
})();

</script>
